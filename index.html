<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030916" />
    <meta
      name="description"
      content="Olitiks personal bio page"
    />
    <title>Olitiks | Bio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="particles" aria-hidden="true"></canvas>

    <main class="card">
      <div class="eyebrow">personal space</div>

      <div class="avatar-wrap" aria-label="Profile avatar">
        <div class="aura" aria-hidden="true"></div>

        <img
          class="avatar"
          src="./images/icon.png"
          alt="Toolgool avatar"
          onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=600&q=85';"
        />

        <img
          class="outline"
          src="./images/outline.png"
          alt=""
          aria-hidden="true"
          onerror="this.style.display='none';"
        />
      </div>

      <h1>Olitiks</h1>
      <p class="subtitle">dreams · games · reality</p>
      <p class="bio">
        A little world of my own.<br />
        Stay close to what makes you feel alive.
      </p>

      <nav class="links" aria-label="Social links">
        <a class="social" href="#" aria-label="Telegram" title="Telegram">T</a>
        <a class="social" href="#" aria-label="Discord" title="Discord">D</a>
        <a class="social" href="#" aria-label="YouTube" title="YouTube">▶</a>
        <a class="social" href="#" aria-label="GitHub" title="GitHub">G</a>
        <a class="social" href="#" aria-label="More links" title="More links">↗</a>
      </nav>

      <div class="footer">always forward</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
